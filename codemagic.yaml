workflows:
  # ============== IOS ==============
  ios-workflow:
    name: Elektron Hamyon - iOS
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "com.woodera.elektronhamyon"
        XCODE_WORKSPACE: "Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.woodera.elektronhamyon
    scripts:
      - name: Flutter paketlarni o'rnatish
        script: |
          flutter packages pub get
      - name: Xcode uchun signing profilini sozlash
        script: |
          xcode-project use-profiles
      - name: iOS uchun IPA yig'ish (release)
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - nackroot.uz@gmail.com
        notify:
          success: true
          failure: true
